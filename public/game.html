<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c09">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=7">
  <link rel="stylesheet" href="/css/flightguide.css?v=25">
  <link rel="stylesheet" href="/css/game.css?v=54">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <title>Play the Course — Disc Jerkers</title>
  <meta name="description" content="Bring your bag and throw the hole. Pick a disc, set your flight, then time the throw. Don't triple bogey. Marebear is watching.">
</head>
<body class="gm-page">
  <header class="masthead">
    <div class="wrap masthead__inner">
      <a class="logo" href="/"><svg class="logo__mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#d35400" stroke-width="3"/><ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="#a3e635" stroke-width="2.4"/><ellipse cx="20" cy="20" rx="6.5" ry="2.4" fill="#a3e635"/></svg> Disc Jerkers</a>
      <nav class="nav">
        <a href="/shop.html">Shop</a>
        <a href="/flightguide"><span class="nav-long">Flight </span>Guide</a>
        <a class="play-btn" href="/game" aria-current="page">Play<span class="nav-long"> now</span></a>
        <a class="cart-btn" href="/cart.html" data-cart-count>Cart</a>
      </nav>
    </div>
  </header>

  <main class="gm" id="gm">
    <section class="gm-stage" id="gm-stage">
      <canvas id="gm-canvas" aria-label="The hole, seen from above. Tee at the bottom, basket at the top."></canvas>
      <div class="gm-hud" id="gm-hud"></div>
      <div class="gm-wind" id="gm-wind" aria-hidden="true"></div>
      <div class="gm-keys" id="gm-keys" hidden aria-hidden="true"></div>
      <div class="gm-toast" id="gm-toast" role="status" aria-live="polite"></div>
      <div class="gm-bubble" id="gm-bubble" aria-live="polite"></div>
      <div class="gm-mini" id="gm-mini" hidden></div>
      <button class="gm-cambtn gm-cambtn--sound" id="gm-sound" type="button" aria-pressed="true">Sound on</button>
      <button class="gm-cambtn gm-cambtn--view" id="gm-view" type="button" hidden aria-pressed="false">Find pin</button>
      <button class="gm-cambtn gm-cambtn--bear" id="gm-bear" type="button" aria-pressed="true">Marebear on</button>
      <button class="gm-cambtn" id="gm-cam" type="button" hidden aria-pressed="false">3D</button>
      <div class="gm-zoom" role="group" aria-label="Zoom the hole"><button type="button" id="gm-zin" aria-label="Zoom in">+</button><button type="button" id="gm-zout" aria-label="Zoom out">−</button></div>
    </section>
    <section class="gm-panel" id="gm-panel" aria-live="polite"><p class="gm-loading">Loading the course…</p></section>
    <div class="gm-fabhost" id="gm-fab"></div>
  </main>

  <script type="module" src="/js/game.js?v=141"></script>
  <script type="module" src="/js/site.js?v=2"></script>
</body>
</html>
