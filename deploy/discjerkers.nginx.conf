# /etc/nginx/sites-available/discjerkers
# Reverse proxy for the Node app (docker-compose publishes it on 127.0.0.1:3040).
#
# discjerkers.com sits behind Cloudflare. Two options for TLS:
#   a) Cloudflare origin cert  -> point ssl_certificate at the origin pem/key
#   b) certbot --nginx -d discjerkers.com -d www.discjerkers.com
#      (requires Cloudflare proxy set to "DNS only" during issuance)
# Check what the other external-domain sites on this box already do before picking.

server {
    listen 80;
    listen [::]:80;
    server_name discjerkers.com www.discjerkers.com;
    return 301 https://discjerkers.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.discjerkers.com;

    ssl_certificate     /etc/ssl/cloudflare/discjerkers.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/discjerkers.com.key;

    return 301 https://discjerkers.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name discjerkers.com;

    ssl_certificate     /etc/ssl/cloudflare/discjerkers.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/discjerkers.com.key;

    client_max_body_size 2m;

    # Stripe posts the webhook here. It must reach the app untouched — no
    # buffering games, and the raw body has to survive.
    location /webhook/stripe {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
